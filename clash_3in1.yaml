mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

dns:
  enable: true
  ipv6: false
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN

proxy-providers:
  kuaiyu:
    type: http
    url: "https://blog.kuaiyu.cc/tree/aHlzd.yaml"
    interval: 86400
    path: ./providers/kuaiyu.yaml
    header:
      User-Agent:
        - "clash-verge/v2.0.0"
    health-check:
      enable: true
      url: "https://www.gstatic.com/generate_204"
      interval: 300

  freeclash-0:
    type: http
    url: "https://node.freeclashnode.com/uploads/2026/08/0-20260806.yaml"
    interval: 86400
    path: ./providers/freeclash-0.yaml
    header:
      User-Agent:
        - "clash-verge/v2.0.0"
    health-check:
      enable: true
      url: "https://www.gstatic.com/generate_204"
      interval: 300

  freeclash-2:
    type: http
    url: "https://node.freeclashnode.com/uploads/2026/08/2-20260806.yaml"
    interval: 86400
    path: ./providers/freeclash-2.yaml
    header:
      User-Agent:
        - "clash-verge/v2.0.0"
    health-check:
      enable: true
      url: "https://www.gstatic.com/generate_204"
      interval: 300

  xinshoucun:
    type: http
    url: "https://xinshoucun.net/sub/clash-20260806.yaml"
    interval: 86400
    path: ./providers/xinshoucun.yaml
    header:
      User-Agent:
        - "clash-verge/v2.0.0"
    health-check:
      enable: true
      url: "https://www.gstatic.com/generate_204"
      interval: 300

proxy-groups:
  - name: "Proxy"
    type: select
    proxies:
      - "Auto"
      - DIRECT
    use:
      - kuaiyu
      - freeclash-0
      - freeclash-2
      - xinshoucun

  - name: "Auto"
    type: url-test
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    use:
      - kuaiyu
      - freeclash-0
      - freeclash-2
      - xinshoucun

  - name: "Streaming"
    type: select
    proxies:
      - "Proxy"
      - "Auto"
      - DIRECT
    use:
      - kuaiyu
      - freeclash-0
      - freeclash-2
      - xinshoucun

  - name: "Foreign"
    type: select
    proxies:
      - "Proxy"
      - "Auto"
      - DIRECT
    use:
      - kuaiyu
      - freeclash-0
      - freeclash-2
      - xinshoucun

  - name: "AI"
    type: select
    proxies:
      - "Proxy"
      - "Auto"
    use:
      - kuaiyu
      - freeclash-0
      - freeclash-2
      - xinshoucun

rules:
  - DOMAIN-SUFFIX,openai.com,AI
  - DOMAIN-SUFFIX,anthropic.com,AI
  - DOMAIN-SUFFIX,claude.ai,AI
  - DOMAIN-SUFFIX,gemini.google.com,AI
  - DOMAIN-SUFFIX,copilot.microsoft.com,AI
  - DOMAIN-SUFFIX,netflix.com,Streaming
  - DOMAIN-SUFFIX,nflxvideo.net,Streaming
  - DOMAIN-SUFFIX,youtube.com,Streaming
  - DOMAIN-SUFFIX,googlevideo.com,Streaming
  - DOMAIN-SUFFIX,disneyplus.com,Streaming
  - DOMAIN-SUFFIX,primevideo.com,Streaming
  - DOMAIN-SUFFIX,spotify.com,Streaming
  - DOMAIN-SUFFIX,twitch.tv,Streaming
  - DOMAIN-SUFFIX,bilibili.com,DIRECT
  - DOMAIN-SUFFIX,google.com,Foreign
  - DOMAIN-SUFFIX,googleapis.com,Foreign
  - DOMAIN-SUFFIX,github.com,Foreign
  - DOMAIN-SUFFIX,githubusercontent.com,Foreign
  - DOMAIN-SUFFIX,twitter.com,Foreign
  - DOMAIN-SUFFIX,x.com,Foreign
  - DOMAIN-SUFFIX,telegram.org,Foreign
  - DOMAIN-SUFFIX,t.me,Foreign
  - DOMAIN-SUFFIX,wikipedia.org,Foreign
  - DOMAIN-SUFFIX,reddit.com,Foreign
  - DOMAIN-SUFFIX,instagram.com,Foreign
  - DOMAIN-SUFFIX,cn,DIRECT
  - DOMAIN-SUFFIX,baidu.com,DIRECT
  - DOMAIN-SUFFIX,qq.com,DIRECT
  - DOMAIN-SUFFIX,taobao.com,DIRECT
  - DOMAIN-SUFFIX,jd.com,DIRECT
  - DOMAIN-SUFFIX,alipay.com,DIRECT
  - DOMAIN-SUFFIX,aliyun.com,DIRECT
  - DOMAIN-SUFFIX,weibo.com,DIRECT
  - DOMAIN-SUFFIX,douyin.com,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,Foreign
