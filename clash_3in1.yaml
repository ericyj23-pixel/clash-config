mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

dns:
  enable: true
  ipv6: false
  default-nameserver: [223.5.5.5, 119.29.29.29]
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN

proxy-providers:
  kuaiyu:
    type: http
    url: https://blog.kuaiyu.cc/tree/aHlzd.yaml
    interval: 86400
    path: ./providers/kuaiyu.yaml
    header:
      User-Agent: ["clash-verge/v2.0.0"]
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

  freeclash-0:
    type: http
    url: https://node.freeclashnode.com/uploads/2026/08/0-20260806.yaml
    interval: 86400
    path: ./providers/freeclash-0.yaml
    header:
      User-Agent: ["clash-verge/v2.0.0"]
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

  freeclash-2:
    type: http
    url: https://node.freeclashnode.com/uploads/2026/08/2-20260806.yaml
    interval: 86400
    path: ./providers/freeclash-2.yaml
    header:
      User-Agent: ["clash-verge/v2.0.0"]
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

  xinshoucun:
    type: http
    url: https://xinshoucun.net/sub/clash-20260806.yaml
    interval: 86400
    path: ./providers/xinshoucun.yaml
    header:
      User-Agent: ["clash-verge/v2.0.0"]
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

proxy-groups:
  - name: 🚀 节点选择
    type: select
    use:
      - kuaiyu
      - freeclash-0
      - freeclash-2
      - xinshoucun

  - name: ♻️ 自动选择
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    use:
      - kuaiyu
      - freeclash-0
      - freeclash-2
      - xinshoucun

  - name: 🎬 流媒体
    type: select
    use:
      - kuaiyu
      - freeclash-0
      - freeclash-2
      - xinshoucun

  - name: 🌍 国外网站
    type: select
    use:
      - kuaiyu
      - freeclash-0
      - freeclash-2
      - xinshoucun

  - name: 🤖 AI 服务
    type: select
    use:
      - kuaiyu
      - freeclash-0
      - freeclash-2
      - xinshoucun

  - name: 🐟 漏网之鱼
    type: select
    use:
      - kuaiyu
      - freeclash-0
      - freeclash-2
      - xinshoucun

rules:
  - DOMAIN-SUFFIX,openai.com,🤖 AI 服务
  - DOMAIN-SUFFIX,anthropic.com,🤖 AI 服务
  - DOMAIN-SUFFIX,claude.ai,🤖 AI 服务
  - DOMAIN-SUFFIX,gemini.google.com,🤖 AI 服务
  - DOMAIN-SUFFIX,copilot.microsoft.com,🤖 AI 服务
