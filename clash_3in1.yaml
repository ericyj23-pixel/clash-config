  - DOMAIN-SUFFIX,twitch.tv,🎬 流媒体
  - DOMAIN-SUFFIX,bilibili.com,DIRECT
  - DOMAIN-SUFFIX,google.com,🌍 国外网站
  - DOMAIN-SUFFIX,googleapis.com,🌍 国外网站
  - DOMAIN-SUFFIX,github.com,🌍 国外网站
